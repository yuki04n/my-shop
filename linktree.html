<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yourshop</title>

<!--
=============================================================
  ✏️ カスタマイズガイド
=============================================================
  【ショップ名】   "yourshop" を変更
  【プロフィール画像】.avatar 内の絵文字を <img> タグに変更
  【自己紹介】    .bio を変更（不要なら削除）
  【SNSリンク】   .social-row の href を変更
  【商品カード】   各 .card の href・画像・テキストを変更
=============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ede8e1;
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 0 16px 60px;
  color: #2a2520;
}

.page {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── プロフィール ── */
.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 0 28px;
  gap: 12px;
  animation: fadeUp .5s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.avatar {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  border: 2px solid rgba(42,37,32,0.15);
  background: #d4cec5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  overflow: hidden;
  margin-bottom: 4px;
}
/*
  ✏️ 画像を使う場合:
  <div class="avatar">
    <img src="profile.jpg" style="width:100%;height:100%;object-fit:cover;">
  </div>
*/

.name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: #2a2520;
}

/* ✏️ 自己紹介が不要なら .bio ごと削除 */
.bio {
  font-size: 13px;
  color: #7a726a;
  text-align: center;
  line-height: 1.65;
  font-weight: 300;
}

/* ── SNS アイコン行 ── */
.social-row {
  display: flex;
  gap: 20px;
  margin-top: 4px;
}
.social-row a {
  color: #4a4540;
  font-size: 22px;
  text-decoration: none;
  opacity: 0.7;
  transition: opacity .2s, transform .2s;
  display: flex;
  align-items: center;
}
.social-row a:hover { opacity: 1; transform: translateY(-2px); }

/* ── カード一覧 ── */
.cards {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card {
  width: 100%;
  display: flex;
  align-items: center;
  background: #f5f1eb;
  border-radius: 10px;
  overflow: hidden;
  text-decoration: none;
  color: #2a2520;
  transition: transform .2s, box-shadow .2s, background .2s;
  animation: fadeUp .5s ease both;
  border: 1px solid rgba(42,37,32,0.07);
  min-height: 80px;
}
.card:nth-child(1) { animation-delay: .05s; }
.card:nth-child(2) { animation-delay: .10s; }
.card:nth-child(3) { animation-delay: .15s; }
.card:nth-child(4) { animation-delay: .20s; }

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(42,37,32,0.1);
  background: #fff;
}

/* 左の画像エリア */
.card-img {
  width: 90px;
  min-width: 90px;
  height: 80px;
  background: #d8d0c5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  overflow: hidden;
  flex-shrink: 0;
}
.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/*
  ✏️ 商品画像を使う場合:
  <div class="card-img"><img src="images/cleaning.jpg" alt="掃除グッズ"></div>
*/

/* 右のテキストエリア */
.card-body {
  flex: 1;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.card-title {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  color: #2a2520;
}
.card-sub {
  font-size: 12px;
  color: #7a726a;
  line-height: 1.5;
  font-weight: 300;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 右矢印 */
.card-arrow {
  padding: 0 16px 0 8px;
  font-size: 14px;
  color: #b0a89e;
  flex-shrink: 0;
}

/* ── フッター ── */
footer {
  margin-top: 48px;
  font-size: 11px;
  color: #b0a89e;
  letter-spacing: 0.5px;
  text-align: center;
}
</style>
</head>
<body>

<div class="page">

  <!-- プロフィール -->
  <div class="profile">
    <!-- ✏️ 絵文字 or <img> に変更 -->
    <div class="avatar">🛍️</div>

    <!-- ✏️ ショップ名を変更 -->
    <div class="name">yourshop</div>

    <!-- ✏️ 自己紹介（不要なら削除） -->
    <div class="bio">掃除グッズ &amp; プロジェクター<br>暮らしをもっと豊かに。</div>

    <!-- ✏️ SNS リンクを変更（不要なアイコンは削除） -->
    <div class="social-row">
      <a href="https://instagram.com/yourshop" title="Instagram">📸</a>
      <a href="mailto:your@email.com" title="メール">✉️</a>
    </div>
  </div>

  <!-- 商品・リンクカード -->
  <div class="cards">

    <!-- 商品1: 掃除グッズ -->
    <!--
      ✏️ 画像を追加する場合:
      <div class="card-img"><img src="images/cleaning.jpg" alt="掃除グッズ"></div>
    -->
    <a href="index.html" class="card">
      <div class="card-img">🧹</div>
      <div class="card-body">
        <div class="card-title">掃除グッズを見る</div>
        <div class="card-sub">プロクリーン スティック — 頑固な汚れも一拭き。毎日使いやすいシンプル設計。</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <!-- 商品2: プロジェクター -->
    <a href="index.html" class="card">
      <div class="card-img">📽️</div>
      <div class="card-body">
        <div class="card-title">プロジェクターを見る</div>
        <div class="card-sub">ルミナ ミニプロジェクター — 手のひらサイズで最大120インチ投影。</div>
      </div>
      <div class="card-arrow">›</div>
    </a>



  </div>

  <!-- フッター -->
  <!-- ✏️ ショップ名を変更 -->
  <footer>© 2025 yourshop</footer>

</div>

</body>
</html>
